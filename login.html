<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Login Form</title>
</head>
<body>
  <h2>Login Page</h2>

  <form onsubmit="return login()">
    <label for="username">Username:</label><br>
    <input type="text" id="username" placeholder="Enter username" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" placeholder="Enter password" required><br><br>

    <input type="submit" value="Login">
  </form>

  <h3 id="message"></h3>

  <script>
    function login() {
      // Get values from input boxes
      let username = document.getElementById("username").value;
      let password = document.getElementById("password").value;

      // Simple check (just for demo)
      if (username === "admin" && password === "1234") {
        document.getElementById("message").innerText = "✅ Login successful! Welcome, " + username + ".";
      } else {
        document.getElementById("message").innerText = "❌ Invalid username or password.";
      }

      // Prevent form from reloading the page
      return false;
    }
  </script>
</body>
</html>
